[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
build_flags =
    -D SERIAL_BAUD=115200

[env:native]
platform = native
test_framework = unity